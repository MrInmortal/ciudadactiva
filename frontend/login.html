<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CiudadActiva</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <a href="index.html" class="back-link">← Volver al inicio</a>
        <div class="auth-box">
            <h2>Bienvenido de nuevo</h2>
            <p>Ingresa tus credenciales para acceder</p>
            
            <form id="formLogin">
                <label for="loginEmail" style="display:none">Correo electrónico</label>
                <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
                
                <div class="password-wrapper">
                    <label for="loginPass" style="display:none">Contraseña</label>
                    <input type="password" id="loginPass" placeholder="Contraseña" required>
                    <span id="togglePassLogin" class="eye-icon">👁️</span>
                </div>

                <div class="form-options">
                    <label><input type="checkbox"> Recordarme</label>
                    <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-primary full-width">Entrar</button>
            </form>
            <p class="auth-footer">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>
    </div>
    <script src="js/login.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
