<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiudadActiva - Panel de Reportes</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/foro.css">
    <link rel="stylesheet" href="css/system-extra.css">
</head>
<body class="foro-page">

    <header>
        <div class="logo-container">
            <img src="img/logo.png" alt="CiudadActiva" class="icon">
            <div>
                <strong>CiudadActiva</strong>
                <small>Participación Ciudadana</small>
            </div>
        </div>

        <div class="auth-btns">
            <button class="theme-toggle-btn" type="button" data-theme-toggle>🌙 Modo oscuro</button>

            <button id="btnAbrirModal" class="btn-primary" type="button">+ Nuevo Reporte</button>

            <div class="notification-menu">
                <button class="notification-bell" id="btnNotificaciones" type="button" aria-label="Ver notificaciones">
                    🔔
                    <span id="notificationCount" class="notification-count" style="display:none;">0</span>
                </button>

                <div id="notificationPanel" class="notification-panel"></div>
            </div>

            <div class="profile-menu">
                <button class="btn-avatar" id="userInitial" type="button" aria-label="Abrir menú de perfil">U</button>

                <div class="dropdown-content">
                    <div class="user-info-dropdown">
                        <div class="btn-avatar avatar-mini" id="userInitialMini">U</div>
                        <div class="user-text">
                            <b id="userNameFull">Usuario</b>
                            <span id="userRoleText">Ciudadano</span>
                        </div>
                    </div>

                    <a href="perfil.html" class="dropdown-link">Mi perfil</a>
                    <a href="dashboard-autoridad.html" class="dropdown-link" id="linkDashboardAutoridad" style="display:none;">Dashboard autoridad</a>
                    <a href="#" class="dropdown-link logout-link" onclick="cerrarSesion()">Cerrar sesión</a>
                </div>
            </div>
        </div>
    </header>

    <section class="dashboard-stats">
        <div class="stat-box">
            <small>Total de reportes</small>
            <h2 id="statTotal">0</h2>
        </div>
        <div class="stat-box stat-pendiente">
            <small>Pendientes</small>
            <h2 id="statPendientes">0</h2>
        </div>
        <div class="stat-box stat-proceso">
            <small>En proceso</small>
            <h2 id="statProceso">0</h2>
        </div>
        <div class="stat-box stat-solucionado">
            <small>Solucionados</small>
            <h2 id="statSolucionados">0</h2>
        </div>
    </section>

    <section class="filter-bar">
        <label for="buscadorReportes" class="sr-only">Buscar reportes</label>
        <input type="text" id="buscadorReportes" class="search-input" placeholder="Buscar por título, categoría o ubicación...">

        <label for="filtroEstado" class="sr-only">Filtrar reportes por estado</label>
        <select id="filtroEstado" class="filter-select" aria-label="Filtrar reportes por estado">
            <option value="">Todos los estados</option>
            <option value="pendiente">Pendiente</option>
            <option value="en proceso">En proceso</option>
            <option value="solucionado">Solucionado</option>
        </select>
    </section>

    <section class="reportes-grid" id="contenedorReportes"></section>

    <div class="modal-overlay" id="modalReporte">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalFormTitle">Crear Nuevo Reporte</h3>
                <button id="btnCerrarX" type="button" class="btn-close-modal" aria-label="Cerrar modal">×</button>
            </div>

            <form id="formReporte" enctype="multipart/form-data">
                <div class="modal-body">
                    <label for="repTitulo" class="form-label">Título *</label>
                    <input type="text" id="repTitulo" class="modal-input" placeholder="Ej: Bache grande en Av. Principal" required>

                    <label for="repCategoria" class="form-label">Categoría *</label>
                    <select id="repCategoria" class="modal-input" required aria-label="Seleccionar categoría">
                        <option value="Infraestructura">Infraestructura</option>
                        <option value="Alumbrado">Alumbrado</option>
                        <option value="Limpieza">Limpieza</option>
                        <option value="Seguridad">Seguridad</option>
                        <option value="Vialidad">Vialidad</option>
                        <option value="Otros">Otros</option>
                    </select>

                    <label for="repUbicacion" class="form-label">Ubicación *</label>
                    <input type="text" id="repUbicacion" class="modal-input" placeholder="Ej: Calle 5 entre Av. Norte y Av. Sur" required>

                    <label for="repDescripcion" class="form-label">Descripción *</label>
                    <textarea id="repDescripcion" class="modal-input textarea-reporte" placeholder="Describe el problema con el mayor detalle posible." required></textarea>

                    <label class="form-label">Imagen (opcional)</label>
                    <div class="upload-area upload-area-compact">
                        <input type="file" id="repImagen" class="hidden-file-input" accept="image/png,image/jpeg,image/jpg,image/webp">
                        <label for="repImagen" class="custom-file-button">Elegir imagen</label>
                        <span id="repImagenNombre" class="custom-file-name">Ningún archivo seleccionado</span>
                        <span class="upload-text">Sube una imagen del problema</span>
                    </div>

                    <img id="previewImagen" alt="Vista previa de la imagen" class="preview-imagen">
                </div>

                <div class="modal-footer-custom">
                    <button type="button" id="btnCerrarModal" class="btn-login">Cancelar</button>
                    <button type="submit" id="btnSubmitReporte" class="btn-primary">Enviar Reporte</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/foro.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
